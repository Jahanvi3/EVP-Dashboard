<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Altudo · EVP Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --display: 'Fraunces', Georgia, serif;
    --body: 'Mulish', -apple-system, BlinkMacSystemFont, sans-serif;
    --bg: #f5f1e8;
    --cream: #fbf8f1;
    --surface: #ffffff;
    --ink: #1e2a3a;
    --ink-soft: #4a5363;
    --ink-faint: #8a8f99;
    --line: #e8e1d4;
    --accent: #3b6e58;
    --accent-tint: #e6efe9;
    --accent-line: #c4d8c9;
    --ok: #5a8a5e; --ok-ink: #3a6b3e; --ok-tint: #ecf2ec; --ok-line: #cbdccc;
    --warn: #c08a3e; --warn-ink: #8a6020; --warn-tint: #f6eddd;
    --flag: #b8623f; --flag-ink: #96482a; --flag-line: #e6c4b4; --flag-tint: #f8ebe4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); font-family: var(--body); color: var(--ink-soft); }
  button { font-family: var(--body); cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .hidden { display: none !important; }

  .pub-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 18px clamp(20px, 5vw, 48px); border-bottom: 1px solid var(--line); background: var(--surface);
    position: sticky; top: 0; z-index: 30; }
  .brand { display: flex; gap: 11px; align-items: center; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
  .brand-name { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
  .brand-sub { font-size: 12px; color: var(--ink-faint); }
  .hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 700; }
  .btn:hover { border-color: var(--accent-line); background: var(--accent-tint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #315c4a; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 7px; }

  main { max-width: 1180px; margin: 0 auto; padding: clamp(22px, 4vw, 40px) clamp(16px, 4vw, 36px) 90px; }

  .page-title { font-family: var(--display); font-size: clamp(26px, 4vw, 36px); color: var(--ink);
    font-weight: 600; margin: 6px 0 6px; letter-spacing: -0.01em; }
  .page-lede { font-size: 14px; color: var(--ink-soft); max-width: 720px; line-height: 1.6; margin: 0 0 8px; }
  .data-meta { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 24px; }
  .data-meta b { color: var(--accent); font-weight: 700; }

  .empty-card { background: var(--cream); border: 1px dashed var(--accent-line); border-radius: 16px;
    padding: 40px 30px; text-align: center; margin-top: 26px; }
  .empty-card h2 { font-family: var(--display); color: var(--ink); font-weight: 600; margin: 0 0 8px; font-size: 22px; }
  .empty-card p { max-width: 560px; margin: 0 auto 18px; font-size: 14px; line-height: 1.65; }

  .section { margin-top: 40px; }
  .section-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800;
    color: var(--accent); margin-bottom: 4px; }
  .section-title { font-family: var(--display); font-size: 21px; color: var(--ink); font-weight: 600; margin: 0 0 4px; }
  .section-sub { font-size: 13px; color: var(--ink-faint); margin: 0 0 16px; max-width: 720px; line-height: 1.55; }

  /* KPI row */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 22px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .kpi .k-label { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; color: var(--ink-faint); }
  .kpi .k-value { font-family: var(--display); font-size: 32px; font-weight: 600; color: var(--ink); margin: 6px 0 2px; }
  .kpi .k-value small { font-size: 16px; color: var(--ink-faint); font-family: var(--body); font-weight: 600; }
  .kpi .k-note { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
  .kpi.tone-ok { border-color: var(--ok-line); background: linear-gradient(180deg, var(--ok-tint), var(--surface)); }
  .kpi.tone-warn { border-color: #ecd9ba; background: linear-gradient(180deg, var(--warn-tint), var(--surface)); }
  .kpi.tone-flag { border-color: var(--flag-line); background: linear-gradient(180deg, var(--flag-tint), var(--surface)); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  /* pillar scorecards */
  .pillar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .pillar-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .pillar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .pillar-name { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--ink); }
  .pillar-sat { font-family: var(--display); font-weight: 700; font-size: 22px; }
  .pillar-meta { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-faint); margin-top: 5px; }
  .bar-track { flex: 1; height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .dist { display: flex; gap: 2px; align-items: flex-end; height: 34px; margin-top: 10px; }
  .dist span { flex: 1; background: var(--accent-line); border-radius: 2px 2px 0 0; min-height: 2px; }
  .dist span.low { background: var(--flag-line); }
  .dist-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-top: 3px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); background: var(--cream); color: var(--ink-soft); }
  .chip.flag { background: var(--flag-tint); border-color: var(--flag-line); color: var(--flag-ink); }
  .chip.warn { background: var(--warn-tint); border-color: #ecd9ba; color: var(--warn-ink); }
  .chip.ok { background: var(--ok-tint); border-color: var(--ok-line); color: var(--ok-ink); }

  /* heatmap */
  .heat-wrap { overflow-x: auto; }
  table.heat { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 12.5px; }
  table.heat th, table.heat td { padding: 8px 10px; text-align: center; border: 1px solid var(--line); }
  table.heat th { background: var(--cream); color: var(--ink); font-weight: 700; font-size: 12px; }
  table.heat td.rowhead { text-align: left; background: var(--cream); font-weight: 700; color: var(--ink); white-space: nowrap; }
  table.heat td .hm-n { display: block; font-size: 10px; color: rgba(30,42,58,.55); font-weight: 600; }

  /* generic tables */
  table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.data th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
    border-bottom: 2px solid var(--line); padding: 8px 10px; }
  table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td b { color: var(--ink); }

  /* narrative */
  .narrative { background: var(--cream); border: 1px solid var(--accent-line); border-radius: 16px; padding: 22px 24px; }
  .narrative ol { margin: 0; padding-left: 20px; display: grid; gap: 12px; }
  .narrative li { font-size: 14px; line-height: 1.65; color: var(--ink-soft); }
  .narrative li b { color: var(--ink); }
  .narrative li .tag { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    border-radius: 5px; padding: 2px 7px; margin-right: 7px; }
  .tag.fix { background: var(--flag-tint); color: var(--flag-ink); }
  .tag.watch { background: var(--warn-tint); color: var(--warn-ink); }
  .tag.protect { background: var(--ok-tint); color: var(--ok-ink); }
  .tag.act { background: var(--accent-tint); color: var(--accent); }

  /* comments */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filters select, .filters input[type=search] { font-family: var(--body); font-size: 13px; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--ink); }
  .theme-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .theme-chips .chip { cursor: pointer; user-select: none; }
  .theme-chips .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .comment { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
  .comment .c-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--ink-faint); }
  .comment .c-top b { color: var(--ink); font-size: 13px; }
  .comment .c-body { font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
  .load-more { text-align: center; margin-top: 8px; }

  /* modal */
  .modal-scrim { position: fixed; inset: 0; background: rgba(30,42,58,.45); display: grid; place-items: center; z-index: 60; padding: 18px; }
  .modal { background: var(--surface); border-radius: 16px; max-width: 640px; width: 100%; max-height: 88vh; overflow: auto; padding: 24px; }
  .modal h3 { font-family: var(--display); color: var(--ink); font-weight: 600; margin: 0 0 6px; }
  .modal p { font-size: 13px; line-height: 1.6; }
  .modal textarea { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink); }
  .drop { border: 2px dashed var(--accent-line); border-radius: 12px; padding: 26px; text-align: center; background: var(--cream);
    font-size: 13px; margin: 12px 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }


  .hdr-search { position: relative; }
  .hdr-search input { width: min(300px, 42vw); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; font-family: var(--body); font-size: 13px; background: var(--cream); color: var(--ink); }
  .hdr-search input:focus { background: #fff; }
  .hdr-suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(30,42,58,.14);
    max-height: 340px; overflow: auto; z-index: 50; }
  .hdr-suggest .sg { display: flex; justify-content: space-between; gap: 8px; align-items: center;
    padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .hdr-suggest .sg:last-child { border-bottom: 0; }
  .hdr-suggest .sg:hover, .hdr-suggest .sg.active { background: var(--accent-tint); }
  .hdr-suggest .sg .sg-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .hdr-suggest .sg .sg-sub { font-size: 11px; color: var(--ink-faint); }
  .foot-note { margin-top: 50px; text-align: center; font-size: 12px; color: var(--ink-faint); }
  svg text { font-family: var(--body); }
  .svg-wrap { width: 100%; }
  .svg-wrap svg { width: 100%; height: auto; display: block; }
  @media print { .pub-header .hdr-actions, .filters, .load-more { display: none; } body { background: #fff; } }
</style>
</head>

/* Career-stage banding for the 32 role titles in the roster. */
function bandOf(role) {
  const r = (role || "").toLowerCase();
  if (!r) return "Unmapped";
  if (r.includes("vice president")) return "Executive (VP+)";
  if (r.includes("director")) return "Director";
  if (r === "trainee" || r.startsWith("junior")) return "Early career";
  if (r.includes("senior manager") || r === "manager" || r.includes("manager sales")) return "Manager";
  if (r.includes("architect")) return "Architect";
  if (r.includes("senior associate")) return "Senior Associate";
  if (r.includes("associate lead") || r === "lead" || r.startsWith("lead ") ||
      r.includes("associate manager") || r.includes("product") || r.includes("program manager")) return "Lead";
  if (r.includes("senior")) return "Senior Associate";  // senior SDR / consultant / AE
  return "Associate"; // associate, SDR, solution consultant, account executive
}

function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function generateDemo() {
  const responses = {};
  const now = Date.now();
  for (const person of ROSTER) {
    const rng = mulberry32(hashStr(person.email));
    if (rng() > 0.74) continue;                       // ~74% participation
    const band = bandOf(person.role);
    const prof = DEMO_PROFILE[band] || DEMO_PROFILE.Unmapped;
    // satisfaction per pillar
    const sat = {}, weights = [];
    for (const k of PKEYS) {
      const [shift, w] = prof[k];
      const noise = (rng() + rng() + rng() - 1.5) * 1.9;   // approx normal
      let s = DEMO_BASE[k] + shift + noise;
      sat[k] = Math.max(1, Math.min(10, Math.round(s)));
      weights.push([k, w * (0.6 + rng() * 0.8)]);
    }
    // importance ranks 1..6: weighted sampling without replacement
    const ranks = {};
    let pool = weights.slice();
    for (let rank = 1; rank <= 6; rank++) {
      const total = pool.reduce((a, x) => a + x[1], 0);
      let pick = rng() * total, idx = 0;
      for (let i = 0; i < pool.length; i++) { pick -= pool[i][1]; if (pick <= 0) { idx = i; break; } }
      ranks[pool[idx][0]] = rank;
      pool.splice(idx, 1);
    }
    // comments: required when sat <= 6; occasional positive otherwise
    const comments = {};
    for (const k of PKEYS) {
      if (sat[k] <= 6) {
        const arr = DEMO_COMMENTS[k];
        comments[k] = arr[Math.floor(rng() * arr.length)];
      } else if (rng() < 0.18) {
        comments[k] = DEMO_COMMENTS.positive[Math.floor(rng() * DEMO_COMMENTS.positive.length)];
      } else comments[k] = "";
    }
    responses[person.email] = {
      email: person.email, name: person.name, role: person.role,
      mentor: person.mentor, mentorEmail: person.mentorEmail,
      submittedAt: now - Math.floor(rng() * 21) * 86400000,
      ranks, sat, comments,
    };
  }
  state.responses = responses;
  state.isDemo = true;
  state.source = "Demo data (generated for preview — replace with real check-in responses)";
  save(); render();
}

/* ---------------- import: CSV / XLSX / JSON ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(x => x.trim() !== "")) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== "")) rows.push(row);
  return rows;
}

function normHeader(h) { return String(h || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }

/* Map arbitrary headers to our fields: identity + {pillar}{rank|sat|comment} */
function guessColumns(headers) {
  const map = {};
  headers.forEach((h, i) => {
    const n = normHeader(h);
    if (!map.email && (n === "email" || n.includes("respondentemail") || n === "emailaddress")) map.email = i;
    else if (!map.name && (n === "name" || n === "respondentname" || n === "employeename" || n === "fullname")) map.name = i;
    else if (!map.submittedAt && (n.includes("submitted") || n === "date" || n === "timestamp")) map.submittedAt = i;
    else if (!map.role && (n === "role" || n === "designation" || n === "title")) map.role = i;
    else if (!map.mentorEmail && n.includes("mentoremail")) map.mentorEmail = i;
    else if (!map.mentor && (n === "mentor" || n === "mentorname")) map.mentor = i;
    for (const k of PKEYS) {
      if (n.startsWith(k) || n.includes(k)) {
        if (n.includes("rank") || n.includes("importance") || n.includes("priority")) map[k + "_rank"] = map[k + "_rank"] ?? i;
        else if (n.includes("sat") || n.includes("score")) map[k + "_sat"] = map[k + "_sat"] ?? i;
        else if (n.includes("comment") || n.includes("note") || n.includes("feedback")) map[k + "_comment"] = map[k + "_comment"] ?? i;
      }
    }
  });
  return map;
}

let LAST_AUDIT = null;
function rowsToResponses(headers, rows) {
  const map = guessColumns(headers);
  if (map.email === undefined) throw new Error("Couldn't find an email column. Include a header containing “email”.");
  const satCols = PKEYS.filter(k => map[k + "_sat"] !== undefined);
  if (!satCols.length) throw new Error("Couldn't find any satisfaction columns (e.g. “Career sat”, “rewards_sat”).");
  // audit: exact header -> field mapping, plus row-level outcomes
  const audit = LAST_AUDIT = { at: Date.now(), receivedRows: rows.length, mapping: [], unmappedHeaders: [],
    skippedNoEmail: 0, skippedNoScores: 0, duplicates: [], notInRoster: [], outOfRange: [], missingRanks: 0, stored: 0 };
  const fieldNames = { email: "Email", name: "Name", role: "Role", mentor: "Mentor", mentorEmail: "Mentor email", submittedAt: "Submitted at" };
  const used = new Set(Object.values(map));
  headers.forEach((h, i) => {
    const f = Object.keys(map).find(k => map[k] === i);
    if (f) {
      const label = fieldNames[f] || (PLABEL[f.split("_")[0]] + " — " + f.split("_")[1]);
      audit.mapping.push({ header: String(h), field: label });
    } else if (String(h).trim()) audit.unmappedHeaders.push(String(h));
  });
  const seen = new Set();
  let added = 0;
  for (const r of rows) {
    const email = String(r[map.email] || "").trim().toLowerCase();
    if (!email || !email.includes("@")) { audit.skippedNoEmail++; continue; }
    if (seen.has(email)) audit.duplicates.push(email); else seen.add(email);
    if (!ROSTER_BY_EMAIL[email] && !audit.notInRoster.includes(email)) audit.notInRoster.push(email);
    const roster = ROSTER_BY_EMAIL[email];
    const sub = state.responses[email] || { ranks: {}, sat: {}, comments: {} };
    sub.email = email;
    sub.name = (map.name !== undefined && r[map.name]) || roster?.name || email.split("@")[0];
    sub.role = (map.role !== undefined && r[map.role]) || roster?.role || "";
    sub.mentor = (map.mentor !== undefined && r[map.mentor]) || roster?.mentor || "";
    sub.mentorEmail = (map.mentorEmail !== undefined && r[map.mentorEmail]) || roster?.mentorEmail || "";
    const d = map.submittedAt !== undefined ? Date.parse(r[map.submittedAt]) : NaN;
    sub.submittedAt = isNaN(d) ? (sub.submittedAt || Date.now()) : d;
    for (const k of PKEYS) {
      if (map[k + "_sat"] !== undefined) {
        const raw = r[map[k + "_sat"]], v = parseFloat(raw);
        if (!isNaN(v)) {
          if (v < 1 || v > 10) audit.outOfRange.push(email + " · " + PLABEL[k] + " satisfaction = " + raw);
          sub.sat[k] = Math.max(1, Math.min(10, v));
        }
      }
      if (map[k + "_rank"] !== undefined) {
        const raw = r[map[k + "_rank"]], v = parseInt(raw, 10);
        if (!isNaN(v)) {
          if (v < 1 || v > 6) audit.outOfRange.push(email + " · " + PLABEL[k] + " rank = " + raw);
          else sub.ranks[k] = v;
        }
      }
      if (map[k + "_comment"] !== undefined) sub.comments[k] = String(r[map[k + "_comment"]] || "");
    }
    if (Object.keys(sub.sat).length) {
      if (!Object.keys(sub.ranks).length) audit.missingRanks++;
      state.responses[email] = sub; added++;
    } else audit.skippedNoScores++;
  }
  audit.stored = Object.keys(state.responses).length;
  return added;
}

/* Power Automate style JSON: array of { email, name, ..., career:{rank,sat,comment}, ... }
   or flat { career_rank, career_sat, ... }. Accepts { value:[...] } / { rows:[...] } wrappers. */
function jsonToResponses(data) {
  let arr = Array.isArray(data) ? data : (data && (data.value || data.rows || data.responses));
  if (!Array.isArray(arr)) throw new Error("Expected a JSON array of responses (or { value: [...] }).");
  let added = 0;
  for (const o of arr) {
    if (!o) continue;
    const email = String(o.email || o.Email || "").trim().toLowerCase();
    if (!email.includes("@")) continue;
    const roster = ROSTER_BY_EMAIL[email];
    const sub = state.responses[email] || { ranks: {}, sat: {}, comments: {} };
    sub.email = email;
    sub.name = o.name || roster?.name || email.split("@")[0];
    sub.role = o.role || roster?.role || "";
    sub.mentor = o.mentor || roster?.mentor || "";
    sub.mentorEmail = o.mentorEmail || roster?.mentorEmail || "";
    const d = Date.parse(o.submittedAt || o.SubmittedAt || "");
    sub.submittedAt = isNaN(d) ? (sub.submittedAt || Date.now()) : d;
    for (const k of PKEYS) {
      const nested = o[k];
      if (nested && typeof nested === "object") {
        if (nested.sat != null) sub.sat[k] = +nested.sat;
        if (nested.rank != null) sub.ranks[k] = +nested.rank;
        if (nested.comment != null) sub.comments[k] = String(nested.comment);
      } else {
        if (o[k + "_sat"] != null) sub.sat[k] = +o[k + "_sat"];
        if (o[k + "_rank"] != null) sub.ranks[k] = +o[k + "_rank"];
        if (o[k + "_comment"] != null) sub.comments[k] = String(o[k + "_comment"]);
      }
    }
    if (Object.keys(sub.sat).length) { state.responses[email] = sub; added++; }
  }
  return added;
}

async function handleFile(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".json")) {
    return jsonToResponses(JSON.parse(await file.text()));
  }
  if (name.endsWith(".xlsx") || name.endsWith(".xls") || name.endsWith(".xlsm")) {
    if (typeof XLSX === "undefined") throw new Error("The Excel reader didn't load (no internet?). Save the file as CSV and import that instead.");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
    const rows = aoa.filter(r => r.some(c => String(c).trim() !== ""));
    return rowsToResponses(rows[0], rows.slice(1));
  }
  const rows = parseCSV(await file.text());
  if (rows.length < 2) throw new Error("The file has no data rows.");
  return rowsToResponses(rows[0], rows.slice(1));
}

/* ---------------- analytics ---------------- */
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
function fmt(n, d = 1) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function personIndex(sub) {
  // Importance-weighted satisfaction: weight = 7 − rank (rank 1 → weight 6).
  let num = 0, den = 0;
  for (const k of PKEYS) {
    const s = sub.sat[k]; if (s == null) continue;
    const w = sub.ranks[k] ? (7 - sub.ranks[k]) : 3.5;
    num += s * w; den += w;
  }
  return den ? num / den : null;
}

function buildStats() {
  const roster = rosterPool();
  const subs = respondentPool();
  const n = subs.length;
  const st = {
    n, rosterN: roster.length, participation: roster.length ? n / roster.length : 0,
    pillars: {}, bands: {}, mentors: {}, attention: [], indices: [],
    nonResponders: roster.filter(r => !state.responses[r.email]),
  };
  for (const k of PKEYS) st.pillars[k] = { sats: [], ranks: [], dist: Array(10).fill(0), low: 0, high: 0, comments: 0 };
  for (const sub of subs) {
    const band = bandOf(sub.role || ROSTER_BY_EMAIL[sub.email]?.role);
    const idx = personIndex(sub);
    if (idx != null) st.indices.push(idx);
    if (!st.bands[band]) st.bands[band] = { n: 0, pillars: Object.fromEntries(PKEYS.map(k => [k, []])), indices: [] };
    st.bands[band].n++; if (idx != null) st.bands[band].indices.push(idx);
    const mentor = sub.mentor || "(no mentor)";
    if (!st.mentors[mentor]) st.mentors[mentor] = { n: 0, indices: [], pillars: Object.fromEntries(PKEYS.map(k => [k, []])) };
    st.mentors[mentor].n++; if (idx != null) st.mentors[mentor].indices.push(idx);
    let lowCount = 0;
    for (const k of PKEYS) {
      const s = sub.sat[k];
      if (s != null) {
        st.pillars[k].sats.push(s);
        st.pillars[k].dist[Math.max(0, Math.min(9, Math.round(s) - 1))]++;
        if (s <= 6) { st.pillars[k].low++; lowCount++; }
        if (s >= 9) st.pillars[k].high++;
        st.bands[band].pillars[k].push(s);
        st.mentors[mentor].pillars[k].push(s);
      }
      if (sub.ranks[k]) st.pillars[k].ranks.push(sub.ranks[k]);
      if ((sub.comments[k] || "").trim()) st.pillars[k].comments++;
    }
    st.attention.push({ sub, idx: idx ?? 0, lowCount, band });
  }
  for (const k of PKEYS) {
    const p = st.pillars[k];
    p.meanSat = mean(p.sats);
    p.meanRank = mean(p.ranks);
    p.importance = p.ranks.length ? 7 - p.meanRank : 3.5;  // 1..6, higher = more important
    p.lowPct = p.sats.length ? p.low / p.sats.length : 0;
    p.highPct = p.sats.length ? p.high / p.sats.length : 0;
  }
  st.evpIndex = mean(st.indices);
  st.atRisk = st.attention.filter(a => a.lowCount >= 3).length;
  st.attention.sort((a, b) => (a.idx - b.idx) || (b.lowCount - a.lowCount));
  return st;
}

function satColor(v) {
  if (v == null || isNaN(v)) return "var(--bg)";
  if (v < 5.5) return "var(--flag)";
  if (v < 7)   return "var(--warn)";
  return "var(--ok)";
}
function heatBg(v) {
  if (v == null || isNaN(v)) return "#f5f1e8";
  const t = Math.max(0, Math.min(1, (v - 4) / 5)); // 4..9 → 0..1
  // flag tint → warn tint → ok tint
  if (t < 0.5) { const u = t / 0.5; return mix("#f3d9cc", "#f6e9d2", u); }
  const u = (t - 0.5) / 0.5; return mix("#f6e9d2", "#d7e7d8", u);
}
function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(x => parseInt(x, 16));
  const pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
  return "#" + pa.map((x, i) => Math.round(x + (pb[i] - x) * t).toString(16).padStart(2, "0")).join("");
}

/* ---------------- priority × satisfaction matrix (SVG) ---------------- */
function matrixSVG(st) {
  const W = 640, H = 440, padL = 52, padR = 20, padT = 26, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;
  const xMin = 1, xMax = 6, yMin = 3, yMax = 10;
  const X = v => padL + ((v - xMin) / (xMax - xMin)) * iw;
  const Y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * ih;
  const xMid = 3.5, yMid = 7;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Priority versus satisfaction matrix">`;
  // quadrant fills
  s += `<rect x="${X(xMid)}" y="${padT}" width="${X(xMax) - X(xMid)}" height="${Y(yMid) - padT}" fill="#ecf2ec"/>`;      // protect
  s += `<rect x="${X(xMid)}" y="${Y(yMid)}" width="${X(xMax) - X(xMid)}" height="${Y(yMin) - Y(yMid)}" fill="#f8ebe4"/>`; // fix first
  s += `<rect x="${padL}" y="${Y(yMid)}" width="${X(xMid) - padL}" height="${Y(yMin) - Y(yMid)}" fill="#f6eddd"/>`;       // monitor
  // quadrant labels
  const qs = [
    [X(xMax) - 8, padT + 16, "end", "PROTECT — high stakes, going well", "#3a6b3e"],
    [X(xMax) - 8, Y(yMin) - 10, "end", "FIX FIRST — high stakes, under-delivering", "#96482a"],
    [padL + 8, padT + 16, "start", "MAINTAIN — lower stakes, going well", "#8a8f99"],
    [padL + 8, Y(yMin) - 10, "start", "MONITOR — lower stakes, under-delivering", "#8a6020"],
  ];
  for (const [x, y, anc, txt, col] of qs)
    s += `<text x="${x}" y="${y}" text-anchor="${anc}" font-size="10.5" font-weight="800" letter-spacing="1" fill="${col}">${txt}</text>`;
  // gridlines + axes
  s += `<line x1="${X(xMid)}" y1="${padT}" x2="${X(xMid)}" y2="${Y(yMin)}" stroke="#c9c2b2" stroke-dasharray="4 4"/>`;
  s += `<line x1="${padL}" y1="${Y(yMid)}" x2="${X(xMax)}" y2="${Y(yMid)}" stroke="#c9c2b2" stroke-dasharray="4 4"/>`;
  s += `<line x1="${padL}" y1="${Y(yMin)}" x2="${X(xMax)}" y2="${Y(yMin)}" stroke="#8a8f99"/>`;
  s += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${Y(yMin)}" stroke="#8a8f99"/>`;
  for (let v = yMin; v <= yMax; v++)
    s += `<text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#8a8f99">${v}</text>`;
  for (let v = xMin; v <= xMax; v++)
    s += `<text x="${X(v)}" y="${Y(yMin) + 16}" text-anchor="middle" font-size="10.5" fill="#8a8f99">${v}</text>`;
  s += `<text x="${(padL + W - padR) / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5363">Importance to employees → (from average rank)</text>`;
  s += `<text x="14" y="${(padT + Y(yMin)) / 2}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5363" transform="rotate(-90 14 ${(padT + Y(yMin)) / 2})">Average satisfaction →</text>`;
  // points
  for (const p of PILLARS) {
    const d = st.pillars[p.key];
    if (!d.sats.length) continue;
    const cx = X(Math.max(xMin, Math.min(xMax, d.importance)));
    const cy = Y(Math.max(yMin, Math.min(yMax, d.meanSat)));
    const r = 9 + d.lowPct * 16;   // bigger bubble = more detractors
    const col = d.importance >= xMid && d.meanSat < yMid ? "#b8623f" : (d.meanSat >= yMid ? "#3b6e58" : "#c08a3e");
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" fill-opacity="0.82" stroke="#fff" stroke-width="2"/>`;
    const above = cy - r - 8 > padT + 20;
    s += `<text x="${cx}" y="${above ? cy - r - 6 : cy + r + 13}" text-anchor="middle" font-size="12" font-weight="800" fill="#1e2a3a">${p.label}</text>`;
    s += `<text x="${cx}" y="${cy + 3.5}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">${fmt(d.meanSat)}</text>`;
  }
  s += `</svg>`;
  return s;
}

/* ---------------- comment themes ---------------- */
const THEMES = [
  ["Pay & compensation", /\bpay\b|salary|compensation|comp\b|band|market|revision|hike|increment|monetar/i],
  ["Promotion & growth", /promot|next level|career path|framework|ladder|growth|advance/i],
  ["Workload & hours", /workload|overtime|hours|crunch|burn|scope creep|staffing|bandwidth|stretch/i],
  ["Manager & leadership", /manager|leader|leadership|decision|communicat/i],
  ["Training & upskilling", /training|certif|learn|course|upskill|shadow|budget/i],
  ["Recognition", /recognit|apprecia|award|shout/i],
  ["Hybrid & flexibility", /hybrid|remote|wfh|office|flexib/i],
  ["Clients & variety", /client|account|project|variety|estimat/i],
];
function allComments() {
  const out = [];
  for (const sub of respondentPool()) {
    for (const k of PKEYS) {
      const c = (sub.comments[k] || "").trim();
      if (!c) continue;
      out.push({ sub, pillar: k, sat: sub.sat[k], text: c, band: bandOf(sub.role || ROSTER_BY_EMAIL[sub.email]?.role) });
    }
  }
  out.sort((a, b) => (a.sat ?? 99) - (b.sat ?? 99));
  return out;
}

/* ---------------- narrative ---------------- */
function buildNarrative(st) {
  const items = [];
  const byNeed = PILLARS.map(p => ({ p, d: st.pillars[p.key] })).filter(x => x.d.sats.length);
  if (!byNeed.length) return items;
  const fixFirst = byNeed.filter(x => x.d.importance >= 3.5 && x.d.meanSat < 7).sort((a, b) => (b.d.importance - b.d.meanSat) - (a.d.importance - a.d.meanSat));
  const best = byNeed.slice().sort((a, b) => b.d.meanSat - a.d.meanSat)[0];
  const worst = byNeed.slice().sort((a, b) => a.d.meanSat - b.d.meanSat)[0];

  if (fixFirst.length) {
    const f = fixFirst[0];
    items.push(`<span class="tag fix">Fix first</span><b>${f.p.label}</b> is the biggest gap: employees rank it among their top priorities (importance ${fmt(f.d.importance)}/6) but score it just <b>${fmt(f.d.meanSat)}/10</b>, with ${Math.round(f.d.lowPct * 100)}% at 6 or below. This is where a visible intervention this quarter earns the most trust per rupee spent.`);
    if (fixFirst[1]) {
      const g = fixFirst[1];
      items.push(`<span class="tag fix">Fix first</span><b>${g.p.label}</b> is the second priority gap (${fmt(g.d.meanSat)}/10 at importance ${fmt(g.d.importance)}/6). Sequence it behind ${fixFirst[0].p.label} rather than diluting effort across both.`);
    }
  }
  items.push(`<span class="tag protect">Protect</span><b>${best.p.label}</b> is the strongest pillar at <b>${fmt(best.d.meanSat)}/10</b> (${Math.round(best.d.highPct * 100)}% score it 9–10). Name it explicitly in employer branding and internal comms — it is the EVP story that is already true.`);

  // weakest band
  const bandRows = Object.entries(st.bands).filter(([, b]) => b.indices.length >= 5)
    .map(([name, b]) => ({ name, idx: mean(b.indices), n: b.indices.length })).sort((a, b) => a.idx - b.idx);
  if (bandRows.length >= 2) {
    const w = bandRows[0], top = bandRows[bandRows.length - 1];
    items.push(`<span class="tag watch">Watch</span>The experience gap by career stage is real: <b>${w.name}</b> has the lowest weighted EVP index (<b>${fmt(w.idx)}</b>, n=${w.n}) versus ${fmt(top.idx)} for ${top.name}. ${w.name === "Senior Associate" ? "This is your delivery backbone and the flight-risk zone for competing offers — prioritize comp-band transparency and promotion visibility here." : "Design interventions for this cohort specifically rather than company-wide averages."}`);
  }
  // mentor cohorts
  const mentorRows = Object.entries(st.mentors).filter(([m, v]) => m !== "(no mentor)" && v.indices.length >= 3)
    .map(([name, v]) => ({ name, idx: mean(v.indices), n: v.indices.length })).sort((a, b) => a.idx - b.idx);
  const flagged = mentorRows.filter(r => r.idx < 6.2);
  if (flagged.length) {
    items.push(`<span class="tag watch">Watch</span><b>${flagged.length} mentor cohort${flagged.length > 1 ? "s" : ""}</b> (${flagged.slice(0, 3).map(f => esc(f.name)).join(", ")}${flagged.length > 3 ? "…" : ""}) average below 6.2 on the weighted index. Treat this as a signal about the cohort's shared context (account, team, workload) before treating it as a mentor performance question.`);
  }
  // participation
  const part = Math.round(st.participation * 100);
  if (part < 100) {
    items.push(`<span class="tag act">Act</span>Participation stands at <b>${part}%</b> (${st.n} of ${st.rosterN}); ${st.nonResponders.length} people haven't responded. Silence is data too — non-response clusters often overlap with disengagement. Route reminder nudges through mentors (each owns ≤9 mentees) rather than one mass email.`);
  }
  const hipoRisk = respondentPool().filter(sub => {
    if (!isHipo(sub.email)) return false;
    const idx = personIndex(sub);
    return idx != null && (idx < 6.5 || PKEYS.filter(k => sub.sat[k] != null && sub.sat[k] <= 6).length >= 2);
  });
  if (hipoRisk.length) {
    items.push(`<span class="tag fix">Fix first</span><b>${hipoRisk.length} of your ${ROSTER.filter(r=>r.hipo).length} HiPos</b> show weak EVP signals (index under 6.5 or two-plus pillars at ≤6). These are the people you've already decided to bet on — losing one costs a succession plan, not just a seat. Click ★ HiPo above to see their full picture and route each into a follow-up task this week.`);
  }
  const tpr = topPerformersAtRisk();
  if (tpr.length) {
    items.push(`<span class="tag fix">Fix first</span><b>${tpr.length} top-rated performers</b> (rating 4–5) show a weighted index under 6.5 or two-plus pillars at ≤6. These are the exits that hurt most and get counter-offered elsewhere first — put them at the front of the attention queue and pair each follow-up task with a concrete retention action, not just a conversation.`);
  }
  if (st.atRisk > 0) {
    items.push(`<span class="tag act">Act</span><b>${st.atRisk} employees</b> scored 6 or below on three or more pillars. These are your highest-probability regrettable exits. The attention list below is ordered for exactly this — commit to a mentor-led development conversation for each within 14 days, using the check-in's tagging workflow.`);
  }
  items.push(`<span class="tag act">Act</span>Close the loop visibly. The single biggest driver of next cycle's participation is whether people saw something change after this one. Publish a short "you said → we did" note against the top two Fix First pillars within 30 days.`);
  return items;
}

function pillarCard(p, st) {
  const d = st.pillars[p.key];
  if (!d.sats.length) return "";
  const maxD = Math.max(...d.dist, 1);
  const rankPct = ((7 - d.importance) - 1) / 5;  // meanRank position
  return `<div class="pillar-card">
    <div class="pillar-head">
      <span class="pillar-name">${p.label}</span>
      <span class="pillar-sat" style="color:${satColor(d.meanSat)}">${fmt(d.meanSat)}<span style="font-size:12px;color:var(--ink-faint)">/10</span></span>
    </div>
    <div class="pillar-meta">${p.desc} · avg importance rank ${fmt(d.meanRank)} of 6</div>
    <div class="bar-row"><span style="width:78px">≤6 (concern)</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.lowPct * 100)}%;background:var(--flag)"></div></div>
      <span style="width:34px;text-align:right">${Math.round(d.lowPct * 100)}%</span></div>
    <div class="bar-row"><span style="width:78px">9–10 (strong)</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.highPct * 100)}%;background:var(--ok)"></div></div>
      <span style="width:34px;text-align:right">${Math.round(d.highPct * 100)}%</span></div>
    <div class="dist">${d.dist.map((v, i) => `<span class="${i <= 5 ? "low" : ""}" style="height:${Math.max(4, Math.round(v / maxD * 100))}%" title="${i + 1}: ${v}"></span>`).join("")}</div>
    <div class="dist-x"><span>1</span><span>5</span><span>10</span></div>
    <div style="margin-top:9px"><span class="chip">${d.comments} comments</span>
      ${d.importance >= 3.5 && d.meanSat < 7 ? '<span class="chip flag">Fix first</span>' : d.meanSat >= 7.5 ? '<span class="chip ok">Strength</span>' : d.meanSat < 7 ? '<span class="chip warn">Monitor</span>' : ""}</div>
  </div>`;
}

function heatmapHTML(st) {
  const bands = BAND_ORDER.filter(b => st.bands[b] && st.bands[b].n > 0);
  let h = `<table class="heat"><tr><th style="text-align:left">Career stage</th>${PILLARS.map(p => `<th>${p.label}</th>`).join("")}<th>Weighted index</th></tr>`;
  for (const b of bands) {
    const bd = st.bands[b];
    h += `<tr><td class="rowhead">${b}<span class="hm-n" style="display:block;font-size:10px;color:var(--ink-faint)">n = ${bd.n}</span></td>`;
    for (const p of PILLARS) {
      const v = bd.pillars[p.key].length ? mean(bd.pillars[p.key]) : null;
      h += `<td style="background:${heatBg(v)};font-weight:700;color:#1e2a3a">${v == null ? "—" : fmt(v)}</td>`;
    }
    const idx = bd.indices.length ? mean(bd.indices) : null;
    h += `<td style="background:${heatBg(idx)};font-weight:800;color:#1e2a3a">${idx == null ? "—" : fmt(idx)}</td></tr>`;
  }
  // company row
  h += `<tr><td class="rowhead">All respondents<span class="hm-n">n = ${st.n}</span></td>`;
  for (const p of PILLARS) h += `<td style="background:${heatBg(st.pillars[p.key].meanSat)};font-weight:800;color:#1e2a3a">${fmt(st.pillars[p.key].meanSat)}</td>`;
  h += `<td style="background:${heatBg(st.evpIndex)};font-weight:800;color:#1e2a3a">${fmt(st.evpIndex)}</td></tr></table>`;
  return h;
}

function mentorTableHTML(st) {
  const rows = Object.entries(st.mentors)
    .filter(([m, v]) => m !== "(no mentor)" && v.n >= 3)
    .map(([name, v]) => {
      const weakest = PILLARS.map(p => ({ p, m: v.pillars[p.key].length ? mean(v.pillars[p.key]) : null }))
        .filter(x => x.m != null).sort((a, b) => a.m - b.m)[0];
      return { name, n: v.n, idx: v.indices.length ? mean(v.indices) : null, weakest };
    })
    .sort((a, b) => (a.idx ?? 99) - (b.idx ?? 99));
  if (!rows.length) return `<p style="font-size:13px">No mentor cohort has 3+ respondents yet.</p>`;
  return `<table class="data"><tr><th>Mentor</th><th>n</th><th>Index</th><th>Weakest pillar</th></tr>` +
    rows.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${r.n}</td>

}

function commentsHTML(st) {
  const comments = allComments();
  const bands = BAND_ORDER.filter(b => st.bands[b]);
  const themeCounts = THEMES.map(([label, rx]) => [label, comments.filter(c => rx.test(c.text)).length]).filter(x => x[1] > 0);
  return `
    <div class="filters">
      <select id="fPillar"><option value="all">All pillars</option>${PILLARS.map(p => `<option value="${p.key}" ${ui.pillar === p.key ? "selected" : ""}>${p.label}</option>`).join("")}</select>
      <select id="fBand"><option value="all">All career stages</option>${bands.map(b => `<option ${ui.band === b ? "selected" : ""}>${b}</option>`).join("")}</select>

    </div>
    <div class="theme-chips">${themeCounts.map(([t, n]) => `<span class="chip ${ui.theme === t ? "active" : ""}" data-theme="${esc(t)}">${t} · ${n}</span>`).join("")}</div>
    <div id="commentList">${renderCommentList(comments)}</div>`;

function filteredComments(comments) {
  return comments.filter(c => {
    if (ui.pillar !== "all" && c.pillar !== ui.pillar) return false;
    if (ui.band !== "all" && c.band !== ui.band) return false;
    if (ui.onlyLow && !(c.sat != null && c.sat <= 6)) return false;
    if (ui.theme) { const th = THEMES.find(t => t[0] === ui.theme); if (th && !th[1].test(c.text)) return false; }
    if (ui.search && !c.text.toLowerCase().includes(ui.search.toLowerCase())) return false;
    return true;
  });
}
function renderCommentList(comments) {
  const list = filteredComments(comments);
  const shown = list.slice(0, ui.commentLimit);
  let h = shown.map(c => `<div class="comment">
    <div class="c-top"><b>${esc(c.sub.name)}</b> · ${esc(c.sub.role || "")}
      <span class="chip">${PLABEL[c.pillar]}</span>
      ${c.sat != null ? `<span class="chip ${c.sat <= 4 ? "flag" : c.sat <= 6 ? "warn" : "ok"}">${c.sat}/10</span>` : ""}</div>
    <div class="c-body">${esc(c.text)}</div></div>`).join("");
  if (!list.length) h = `<p style="font-size:13px;color:var(--ink-faint)">No comments match these filters.</p>`;
  if (list.length > shown.length) h += `<div class="load-more"><button class="btn small" id="btnMore">Show ${Math.min(20, list.length - shown.length)} more (${list.length - shown.length} left)</button></div>`;
  return h;
}
function wireFilters() {
  const rerenderComments = () => { document.getElementById("commentList").innerHTML = renderCommentList(allComments()); wireMore(); };
  const wireMore = () => { const b = document.getElementById("btnMore"); if (b) b.onclick = () => { ui.commentLimit += 20; rerenderComments(); }; };
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("fPillar", "change", e => { ui.pillar = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  on("fBand", "change", e => { ui.band = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  on("fLow", "change", e => { ui.onlyLow = e.target.checked; ui.commentLimit = 12; rerenderComments(); });
  on("fSearch", "input", e => { ui.search = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  document.querySelectorAll(".theme-chips .chip").forEach(ch => ch.addEventListener("click", () => {
    ui.theme = ui.theme === ch.dataset.theme ? "" : ch.dataset.theme; ui.commentLimit = 12;
    document.querySelectorAll(".theme-chips .chip").forEach(c => c.classList.toggle("active", c.dataset.theme === ui.theme));
    rerenderComments();
  }));
  wireMore();
}


/* Accepts whatever the Power Automate "return responses" flow sends back:
   a raw array, or { value:[...] } / { rows:[...] } / { body:[...] } wrappers.
   Flat rows (Excel columns, any naming) go through the same header-guessing
   as file imports; nested { career:{rank,sat,comment} } payloads are handled
   directly. */
function autoImportJSON(data) {
  let arr = Array.isArray(data) ? data : (data && (data.value || data.rows || data.responses || data.body));
  if (arr && !Array.isArray(arr) && Array.isArray(arr.value)) arr = arr.value; // { body: { value: [...] } }
  if (!Array.isArray(arr) || !arr.length) throw new Error("The link returned no response rows.");
  const nested = arr.some(o => o && PKEYS.some(k => o[k] && typeof o[k] === "object"));
  if (nested) return jsonToResponses(arr);
  // flat objects -> table -> header guessing
  const headers = Object.keys(Object.assign({}, ...arr.map(o => o || {})));
  const rows = arr.map(o => headers.map(h => (o && o[h] != null) ? o[h] : ""));
  return rowsToResponses(headers, rows);
}

async function syncFromExcel(opts) {
  opts = opts || {};
  const url = (state.readUrl || "").trim();
  if (!url) { if (!opts.silent) openConnect(); return; }
  const btn = document.getElementById("btnSync");
  if (btn) { btn.disabled = true; btn.textContent = "Syncing…"; }
  try {
    const res = await fetch(url, { method: "GET" });
    const bodyText = await res.text();
    if (!res.ok) {
      let detail = "";
      try { const j = JSON.parse(bodyText); detail = j.error?.message || j.message || bodyText; } catch { detail = bodyText; }
      throw new Error("the flow returned status " + res.status + (detail ? " — " + String(detail).slice(0, 220) : ""));
    }
    if (!bodyText.trim()) {
      throw new Error("the flow replied with an EMPTY body (status " + res.status + "). This means the flow has no Response action, or its Body field is blank. Fix: add a Response action as the last step, Status 200, and set Body = the 'value' output from List rows present in a table.");
    }
    let payload;
    try { payload = JSON.parse(bodyText); }
    catch { throw new Error("the flow's reply isn't valid JSON. It starts with: \"" + bodyText.slice(0, 120) + "…\". Set the Response Body to the 'value' output of List rows (and header Content-Type: application/json)."); }
    // The Excel is the single source of truth: rebuild from scratch on every
    // sync so stale/demo/deleted rows can never linger and skew the numbers.
    const previous = state.responses;
    state.responses = {};
    let added;
    try { added = autoImportJSON(payload); }
    catch (err) { state.responses = previous; throw err; }   // keep old data if the payload was unusable
    state.isDemo = false;
    state.audit = LAST_AUDIT;
    state.source = "Power Automate Excel (synced " + new Date().toLocaleTimeString() + ")";
    state.lastSync = Date.now();
    save();
    if (state.taskReadUrl) await syncTasks({ silent: true, noRender: true });
    render();
    if (!opts.silent) flashNote("Synced — " + added + " responses updated from Excel.");
  } catch (err) {
    if (!opts.silent) alert("Sync failed: " + err.message + "\n\nMost common fixes:\n1) In the flow's trigger, set Method = GET (Advanced parameters). A blank method expects POST and returns 400.\n2) Leave the trigger's Request Body JSON Schema empty.\n3) Make sure the full URL was copied, including everything after ? (the sig= part).\n4) Response action needs headers Content-Type: application/json and Access-Control-Allow-Origin: *\n\nQuick test: paste the URL in a new browser tab — you should see your rows as JSON.");
  } finally {
    const b = document.getElementById("btnSync");
    if (b) { b.disabled = false; b.textContent = "Sync from Excel"; }
  }
}

/* ============================================================
   Shared tasks: write/read via Power Automate + "My tasks"
   ------------------------------------------------------------
   Event model (append-only, Excel-friendly):
     Task rows:    id,email,name,pillar,assignee,assigneeEmail,note,due,status,createdAt,score,comment
     Update rows:  taskId,by,text,status,at
   Write flow (POST): body is one of
     { type:"task", ...taskRow }  |  { type:"update", ...updateRow }
   Read flow (GET) returns { tasks:[rows], updates:[rows] } (or just an array of task rows).
   ============================================================ */
async function postTaskEvent(evt) {
  const url = (state.taskWriteUrl || "").trim();
  if (!url) return false;
  try {
    // No Content-Type header on purpose: a JSON header triggers a CORS preflight
    // that Power Automate's HTTP trigger won't answer. Sent as text/plain,
    // the flow still parses it with a Parse JSON action on triggerBody().
    const res = await fetch(url, { method: "POST", body: JSON.stringify(evt) });
    if (!res.ok) throw new Error("status " + res.status);
    return true;
  } catch (err) {
    flashNote("Saved on this device — couldn't reach the task flow (" + err.message + "). It will show for others after the flow is fixed and the task is re-sent.");
    return false;
  }
}

function applyUpdate(t, u) {
  if (!t.updates) t.updates = [];
  const at = +u.at || Date.parse(u.at) || Date.now();
  if (u.status && ["open", "progress", "done"].includes(String(u.status))) {
    t.status = u.status; if (u.status === "done") t.doneAt = at;
  }
  const text = String(u.text || "").trim();
  if (text) {
    const dup = t.updates.some(x => x.text === text && Math.abs(x.at - at) < 2000);
    if (!dup) t.updates.push({ by: u.by || "", text, at });
  }
  t.updates.sort((a, b) => a.at - b.at);
}

function mergeRemoteTasks(payload) {
  let tasks = payload, updates = [];
  if (payload && !Array.isArray(payload)) {
    tasks = payload.tasks || payload.value || [];
    updates = payload.updates || [];
    if (tasks && !Array.isArray(tasks) && Array.isArray(tasks.value)) tasks = tasks.value;
    if (updates && !Array.isArray(updates) && Array.isArray(updates.value)) updates = updates.value;
  }
  if (!Array.isArray(tasks)) tasks = [];
  const byId = Object.fromEntries(state.tasks.map(t => [t.id, t]));
  for (const row of tasks) {
    if (!row || !row.id) continue;
    let t = byId[row.id];
    if (!t) {
      t = { updates: [] , status: "open" };
      state.tasks.push(t); byId[row.id] = t;
    }
    for (const k of ["id","email","name","pillar","assignee","assigneeEmail","note","due","comment"]) if (row[k] != null && row[k] !== "") t[k] = String(row[k]);
    if (row.score != null && row.score !== "") t.score = +row.score;
    t.createdAt = +row.createdAt || Date.parse(row.createdAt) || t.createdAt || Date.now();
    if (row.status && ["open","progress","done"].includes(String(row.status))) t.status = t.status === "done" ? t.status : String(row.status);
  }
  for (const u of (Array.isArray(updates) ? updates : [])) {
    const t = byId[u.taskId]; if (t) applyUpdate(t, u);
  }
  save();
}

async function syncTasks(opts) {
  opts = opts || {};
  const url = (state.taskReadUrl || "").trim();
  if (!url) return;
  try {
    const res = await fetch(url, { method: "GET" });
    const bodyText = await res.text();
    if (!res.ok) {
      let detail = ""; try { const j = JSON.parse(bodyText); detail = j.error?.message || j.message || bodyText; } catch { detail = bodyText; }
      throw new Error("status " + res.status + (detail ? " — " + String(detail).slice(0, 160) : ""));
    }
    if (!bodyText.trim()) throw new Error("empty reply — the task read flow is missing its Response action or the Body is blank.");
    let payload; try { payload = JSON.parse(bodyText); } catch { throw new Error("task flow reply isn't valid JSON: \"" + bodyText.slice(0, 100) + "…\""); }
    mergeRemoteTasks(payload);
    if (!opts.noRender) render();
  } catch (err) {
    if (!opts.silent) flashNote("Task sync failed: " + err.message);
  }
}

  const roleCounts = {};
  for (const r of ROSTER) if (r.role) roleCounts[r.role] = (roleCounts[r.role] || 0) + 1;
  const seniority = role => {
    const r = role.toLowerCase();
    if (r === "senior vice president") return 1;
    if (r === "vice president") return 2;
    if (r === "associate vice president") return 3;
    if (r === "senior director") return 4;

  const sortedRoles = Object.keys(roleCounts).sort((a, b) => seniority(a) - seniority(b) || a.localeCompare(b));
  const rolePanel = ui.rolePanelOpen ? `

function wireRatingBar() {
  document.querySelectorAll("#ratingChips .chip[data-rating]").forEach(ch => ch.addEventListener("click", () => {
    const rt = ch.dataset.rating;

    ui.peopleLimit = 15; ui.commentLimit = 12;

  }));

  if (hc) hc.addEventListener("click", () => { ui.hipoOnly = !ui.hipoOnly; ui.peopleLimit = 15; ui.commentLimit = 12; render(); });
  const rt = document.getElementById("roleToggle");
  if (rt) rt.addEventListener("click", e => { e.stopPropagation(); ui.rolePanelOpen = !ui.rolePanelOpen; render(); });
  const panel = document.getElementById("rolePanel");
  if (panel) {
    panel.addEventListener("click", e => e.stopPropagation());
    const scrollKeep = ui._roleScroll || 0;
    panel.firstElementChild && (panel.firstElementChild.scrollTop = scrollKeep);
    panel.querySelectorAll("input[data-rolebox]").forEach(cb => cb.addEventListener("change", () => {
      ui._roleScroll = panel.firstElementChild ? panel.firstElementChild.scrollTop : 0;
      const role = cb.dataset.rolebox;
      ui.roleSel = cb.checked ? ui.roleSel.concat(role) : ui.roleSel.filter(x => x !== role);
      ui.peopleLimit = 15; ui.commentLimit = 12;
      render();   // panel stays open (ui.rolePanelOpen still true)
    }));
    const done = document.getElementById("roleDone");
    if (done) done.addEventListener("click", () => { ui.rolePanelOpen = false; render(); });
    const none = document.getElementById("roleNone");
    if (none) none.addEventListener("click", () => { ui.roleSel = []; render(); });
  }
  document.querySelectorAll("#ratingChips .chip[data-role]").forEach(ch => ch.addEventListener("click", () => {
    ui.roleSel = ui.roleSel.filter(x => x !== ch.dataset.role); render();
  }));

/* close the designation panel when clicking anywhere outside it */
if (!window.__rolePanelCloser) {
  window.__rolePanelCloser = true;
  document.addEventListener("click", e => {
    if (!ui.rolePanelOpen) return;
    // If the clicked element is no longer in the document, this same click
    // already caused a re-render (e.g. toggling a checkbox) — never treat
    // a detached node as an "outside" click.
    if (!document.body.contains(e.target)) return;
    const panel = document.getElementById("rolePanel");
    const toggle = document.getElementById("roleToggle");
    if (panel && !panel.contains(e.target) && e.target !== toggle && !(toggle && toggle.contains(e.target))) {
      ui.rolePanelOpen = false; render();
    }
  });
}

/* ---- performance rating × EVP ---- */
function ratingStats() {
  const groups = {};
  for (const sub of respondentPool()) {
    const rt = ratingOf(sub.email);
    if (!groups[rt]) groups[rt] = { n: 0, indices: [], pillars: Object.fromEntries(PKEYS.map(k => [k, []])) };
    const g = groups[rt]; g.n++;
    const idx = personIndex(sub); if (idx != null) g.indices.push(idx);
    for (const k of PKEYS) if (sub.sat[k] != null) g.pillars[k].push(sub.sat[k]);
  }
  return groups;
}
function ratingHeatHTML() {
  const groups = ratingStats();
  const order = RATING_ORDER.filter(rt => groups[rt] && groups[rt].n >= 3);
  if (!order.length) return "";
  let h = `<table class="heat"><tr><th style="text-align:left">Performance rating</th>${PILLARS.map(p => `<th>${p.label}</th>`).join("")}<th>Weighted index</th></tr>`;
  for (const rt of order) {
    const g = groups[rt];
    h += `<tr><td class="rowhead">${esc(rt)}<span class="hm-n">n = ${g.n}</span></td>`;
    for (const p of PILLARS) {
      const v = g.pillars[p.key].length ? mean(g.pillars[p.key]) : null;
      h += `<td style="background:${heatBg(v)};font-weight:700;color:#1e2a3a">${v == null ? "—" : fmt(v)}</td>`;
    }
    const idx = g.indices.length ? mean(g.indices) : null;
    h += `<td style="background:${heatBg(idx)};font-weight:800;color:#1e2a3a">${idx == null ? "—" : fmt(idx)}</td></tr>`;
  }
  h += `</table>`;
  return `<section class="section">
    <div class="section-eyebrow">Performance × experience</div>
    <h2 class="section-title">Satisfaction by performance rating</h2>
    <p class="section-sub">The retention question in one table: are your 4s and 5s happier than your 3s? If the top-rated rows are amber on Rewards or Career, your best people are the ones being under-served — that is regrettable-attrition risk in the making.</p>
    <div class="card heat-wrap">${h}</div>
  </section>`;
}
function topPerformersAtRisk() {
  return respondentPool().filter(sub => {
    const rt = ratingOf(sub.email);
    if (rt !== "4" && rt !== "5") return false;
    const idx = personIndex(sub);
    return idx != null && (idx < 6.5 || PKEYS.filter(k => sub.sat[k] != null && sub.sat[k] <= 6).length >= 2);
  });
}

function summaryMailto(sub, r) {
  const lows = PKEYS.filter(k => sub.sat[k] != null && sub.sat[k] <= 6);
  const lines = [
`Hi ${(r.mentor || "").split(" ")[0] || "there"},`,
``,
`Sharing ${sub.name}'s EVP Check-In summary so you can plan your next development conversation.`,
``,
`Scores (satisfaction /10, priority rank in brackets):`];
  for (const k of PKEYS) if (sub.sat[k] != null)
    lines.push(`  - ${PLABEL[k]}: ${sub.sat[k]}/10 (priority #${sub.ranks[k] ?? "-"})${sub.sat[k] <= 6 ? "  << needs attention" : ""}`);
  if (lows.length) {
    lines.push(``, `Comments on the low areas:`);
    for (const k of lows) if ((sub.comments[k] || "").trim()) lines.push(`  - ${PLABEL[k]}: "${sub.comments[k]}"`);
  }
  lines.push(``, `Suggested next step: a 1:1 within the next two weeks focused on ${lows.map(k => PLABEL[k]).join(", ") || "reinforcing what's working"}.`, ``, `Thanks!`);
  return `mailto:${r.mentorEmail || ""}?subject=${encodeURIComponent(`EVP check-in summary: ${sub.name}`)}&body=${encodeURIComponent(lines.join("\n"))}`;
}

    assignee: document.getElementById("tWho").value.trim(),
    assigneeEmail: document.getElementById("tWhoEmail").value.trim(),
    note: document.getElementById("tNote").value.trim(),
    due: document.getElementById("tDue").value,
    status: "open", createdAt: Date.now(),
    score: s.submitted ? s.sub.sat[document.getElementById("tPillar").value] : null,
    comment: s.submitted ? (s.sub.comments[document.getElementById("tPillar").value] || "") : "",
  });
  const persist = t => { state.tasks.push(t); save(); postTaskEvent({ type: "task", ...t, updates: undefined }); };
  document.getElementById("tSave").onclick = () => { persist(build()); closeModal(); render();
    flashNote(state.taskWriteUrl ? "Task saved and sent to the shared tracker." : "Task saved on this device."); };
  document.getElementById("tSaveSend").onclick = () => {
    const t = build(); persist(t); closeModal(); render();
    window.location.href = taskMailto(t);
  };
}
function taskSuggestion(s, pillar) {
  if (!s.submitted || !pillar) return "";
  const score = s.sub.sat[pillar], c = (s.sub.comments[pillar] || "").trim();
  const stems = {
    career: "Walk them through the promotion framework for their track, agree 2–3 concrete gaps to close this cycle, and put a date on the next career conversation.",
    learning: "Agree one certification or structured learning goal for this quarter and unblock the budget/approval for it.",
    people: "Have a 1:1 to understand the team friction, then align ownership with the other party involved.",
    culture: "Discuss where stated values and day-to-day experience diverge for them, and pick one visible fix.",
    rewards: "Share their compensation band positioning, explain how the last revision was decided, and confirm the next review date.",
    work: "Review their current staffing/scope, agree what changes (variety, estimation, load), and set a check-back date.",
  };
  let out = stems[pillar] || "";
  if (c) out += `\n\nTheir comment (${score}/10): "${c}"`;
  return out;
}
function taskMailto(t) {
  const dueTxt = t.due ? new Date(t.due + "T00:00:00").toLocaleDateString() : "in the next two weeks";
  const body =
`Hi ${(t.assignee || "").split(" ")[0] || "there"},

From ${t.name}'s EVP Check-In: ${PLABEL[t.pillar]} scored ${t.score != null ? t.score + "/10" : "low"}${t.comment ? `, with this comment:

  "${t.comment}"` : "."}

What we'd like you to own (due ${dueTxt}):
${t.note}

Please reply with what was agreed after you've spoken — I'll close the loop with ${t.name.split(" ")[0]} from our side too.

Thank you!`;
  return `mailto:${t.assigneeEmail}?subject=${encodeURIComponent(`Follow-up needed: ${t.name} — ${PLABEL[t.pillar]}`)}&body=${encodeURIComponent(body)}`;
}

function tasksHTML() {
  const tasks = state.tasks.slice().sort((a, b) => (a.status === "done") - (b.status === "done") || (a.due || "").localeCompare(b.due || ""));
  const open = tasks.filter(t => t.status !== "done").length;
  const overdue = tasks.filter(t => t.status !== "done" && t.due && t.due < new Date().toISOString().slice(0, 10)).length;
  if (!tasks.length) return `<div class="card" style="text-align:center;padding:26px"><p style="margin:0;font-size:13.5px">No follow-up tasks yet. Assign one from the attention list or any person's profile — low scores that nobody owns don't improve.</p></div>`;
  const rows = tasks.map(t => `<tr style="${t.status === "done" ? "opacity:.55" : ""}">
    <td><b>${esc(t.name)}</b><br><span style="font-size:11.5px;color:var(--ink-faint)">${PLABEL[t.pillar]}${t.score != null ? " · " + t.score + "/10" : ""}</span></td>
    <td style="font-size:12.5px">${esc(t.note).slice(0, 110)}${t.note.length > 110 ? "…" : ""}
      ${(t.updates && t.updates.length) ? `<div style="font-size:11.5px;color:var(--accent);margin-top:3px">↳ ${esc(t.updates[t.updates.length-1].by || "")}: ${esc(t.updates[t.updates.length-1].text).slice(0,90)}</div>` : ""}<br>
      <span style="font-size:11.5px;color:var(--ink-faint)">→ ${esc(t.assignee || t.assigneeEmail || "unassigned")} · due ${t.due ? new Date(t.due + "T00:00:00").toLocaleDateString() : "—"}
      ${t.status !== "done" && t.due && t.due < new Date().toISOString().slice(0, 10) ? '<span class="chip flag">overdue</span>' : ""}</span></td>
    <td style="white-space:nowrap;text-align:right">
      <select onchange="setTaskStatus('${t.id}', this.value)" style="border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px">
        <option value="open" ${t.status === "open" ? "selected" : ""}>Open</option>
        <option value="progress" ${t.status === "progress" ? "selected" : ""}>In progress</option>
        <option value="done" ${t.status === "done" ? "selected" : ""}>Done</option>
      </select>
      <a class="btn small" style="text-decoration:none" href="${taskMailto(t)}">Email</a>
      <button class="btn small ghost" onclick="deleteTask('${t.id}')">✕</button></td></tr>`).join("");
  return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <span class="chip ${open ? "warn" : "ok"}">${open} open</span>
      ${overdue ? `<span class="chip flag">${overdue} overdue</span>` : ""}
      <span style="flex:1"></span>
      <button class="btn small" onclick="exportTasks()">Export CSV</button>
    </div>
    <div class="card" style="padding:8px 14px;max-height:440px;overflow:auto"><table class="data">${rows}</table></div>`;
}
function setTaskStatus(id, status) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  t.status = status; if (status === "done") t.doneAt = Date.now();
  save(); render();
  postTaskEvent({ type: "update", taskId: id, by: "HR", status, text: "", at: Date.now() });
  flashNote(status === "done" ? "Task closed — remember to tell the employee what changed." : "Task updated.");
}
function deleteTask(id) { state.tasks = state.tasks.filter(t => t.id !== id); save(); render(); }
function exportTasks() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["Employee","Email","Pillar","Score","Assignee","Assignee email","Task","Due","Status","Created"].map(q).join(",")]
    .concat(state.tasks.map(t => [t.name, t.email, PLABEL[t.pillar], t.score, t.assignee, t.assigneeEmail, t.note, t.due, t.status, new Date(t.createdAt).toISOString().slice(0,10)].map(q).join(",")));
  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "evp-follow-up-tasks.csv"; a.click();
  URL.revokeObjectURL(a.href);
}
function wirePeople() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("pSearch", "input", e => { ui.peopleSearch = e.target.value; ui.peopleLimit = 15;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); const s = document.getElementById("pSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
  on("pFilter", "change", e => { ui.peopleFilter = e.target.value; ui.peopleLimit = 15;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); } });
  on("pMore", "click", () => { ui.peopleLimit = (ui.peopleLimit || 15) + 20;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); } });
}

/* ---------------- import modal ---------------- */
function openImport() {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal">
    <h3>Import check-in responses</h3>
    <p>Bring in the Excel/CSV file that Power Automate maintains, a CSV export, or the raw JSON payloads. Columns are auto-detected — headers just need to contain the pillar name plus <b>rank</b>, <b>sat</b>/<b>score</b>, or <b>comment</b> (e.g. <i>career_sat</i>, <i>Rewards rank</i>). Rows are matched to the roster by email; re-importing updates existing rows.</p>
    <div class="drop" id="drop">Drop a .xlsx / .csv / .json file here, or
      <label style="color:var(--accent);font-weight:700;cursor:pointer"> browse<input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.xlsm,.json" style="display:none"></label></div>
    <p style="margin-bottom:6px"><b>Or paste JSON</b> (array of submissions, Power Automate shape supported):</p>
    <textarea id="jsonPaste" placeholder='[{"email":"a@altudo.co","career":{"rank":1,"sat":6,"comment":"..."}, ...}]'></textarea>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">Cancel</button>
      <button class="btn primary" id="btnPaste">Import pasted JSON</button>
    </div>
  </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("btnCancel").onclick = close;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") close(); });
  if (state.isDemo) { state.responses = {}; state.isDemo = false; }   // real data must never mix with demo
  const finish = added => { state.source = `Imported responses (${Object.keys(state.responses).length} total)`; save(); close(); render(); alert(`Imported/updated ${added} responses.`); };
  document.getElementById("fileInput").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { finish(await handleFile(f)); } catch (err) { alert("Import failed: " + err.message); }
  });
  const drop = document.getElementById("drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); });
  drop.addEventListener("drop", async e => {
    e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return;
    try { finish(await handleFile(f)); } catch (err) { alert("Import failed: " + err.message); }
  });
  document.getElementById("btnPaste").onclick = () => {
    try { finish(jsonToResponses(JSON.parse(document.getElementById("jsonPaste").value))); }
    catch (err) { alert("Import failed: " + err.message); }
  };
}

/* ---------------- global employee search ---------------- */
function wireGlobalSearch() {
  const input = document.getElementById("globalSearch");
  const box = document.getElementById("globalSuggest");
  if (!input || !box) return;
  let cursor = -1, matches = [];
  const close = () => { box.classList.add("hidden"); cursor = -1; };
  const show = () => {
    const q = input.value.toLowerCase().trim();
    if (q.length < 2) { close(); return; }
    matches = ROSTER.filter(r => r.name.toLowerCase().includes(q) || r.email.includes(q) ||
      (r.role || "").toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { box.innerHTML = `<div class="sg"><span class="sg-sub">No match in the roster</span></div>`; box.classList.remove("hidden"); return; }
    box.innerHTML = matches.map((r, i) => {
      const s = personStatus(r.email);
      const badge = s.submitted
        ? `<span class="chip ${s.idx < 5.5 ? "flag" : s.idx < 7 ? "warn" : "ok"}">${fmt(s.idx)}</span>`
        : `<span class="chip">pending</span>`;
      return `<div class="sg ${i === cursor ? "active" : ""}" data-email="${r.email}">
        <span><span class="sg-name">${esc(r.name)}</span><br><span class="sg-sub">${esc(r.role)} · ${esc(r.mentor || "—")}</span></span>${badge}</div>`;
    }).join("");
    box.classList.remove("hidden");
    box.querySelectorAll(".sg[data-email]").forEach(el => el.addEventListener("mousedown", e => {
      e.preventDefault(); openPerson(el.dataset.email); input.value = ""; close();
    }));
  };
  input.addEventListener("input", () => { cursor = -1; show(); });
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    if (e.key === "Escape") { input.value = ""; close(); return; }
    if (!matches.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor + 1, matches.length - 1); show(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor - 1, 0); show(); }
    else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); openPerson(matches[cursor].email); input.value = ""; close(); }
    else if (e.key === "Enter" && matches.length === 1) { e.preventDefault(); openPerson(matches[0].email); input.value = ""; close(); }
  });
}

function clearData() {
  if (!confirm("Clear all loaded responses from this browser? (The saved sync link is kept.)")) return;
  state = { responses: {}, source: "", readUrl: state.readUrl || "", tasks: state.tasks || [] }; save(); closeModal(); render();
}

/* ---------------- header events + boot ---------------- */

/* Live updates: the Excel keeps growing, so quietly re-sync every 60s while
   the tab is visible, and immediately when the user returns to the tab. */
let autoBusy = false;
async function autoRefresh() {
  if (autoBusy || document.hidden || !whoAmI()) return;
  autoBusy = true;
  try {
    if (state.readUrl) await syncFromExcel({ silent: true });
    if (state.taskReadUrl) await syncTasks({ silent: true, noRender: true });
  } finally { autoBusy = false; }
}
setInterval(autoRefresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoRefresh(); });
